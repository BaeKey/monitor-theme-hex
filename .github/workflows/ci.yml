name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for mount-path regression
        run: npx playwright install --with-deps chromium
      - name: Root and subpath browser regression
        env:
          TEST_BROWSER: chromium
        run: npm run test:subpath
      - name: Theme field visibility regression
        env:
          TEST_BROWSER: chromium
        run: npx playwright test tests/info-visibility.spec.ts tests/site-config.spec.ts --workers=1
